name: app_fabrik

packages:
  - packages/**
  - apps/**

command:
  bootstrap:
    runPubGetInParallel: true

scripts:
  analyze:
    description: Statische Analyse über alle Pakete, bricht bei jedem Befund.
    run: dart run melos exec -c 1 -- flutter analyze --fatal-infos --fatal-warnings

  format-check:
    description: Formatierung prüfen, ohne zu ändern.
    run: dart format --output=none --set-exit-if-changed .

  test:
    description: Unit-, Widget- und Golden-Tests aller Pakete mit Tests.
    run: dart run melos exec -c 1 --dir-exists=test -- flutter test --reporter expanded

  test-golden-update:
    description: Golden-Referenzbilder neu erzeugen. Nur nach Sichtprüfung aufrufen.
    run: dart run melos exec -c 1 --dir-exists=test -- flutter test --update-goldens

  build-web:
    description: Web-Build eines Flavors. Aufruf-  melos run build-web -- vox
    run: |
      flutter build web --release --no-web-resources-cdn \
        --dart-define=FLAVOR=$1 \
        --dart-define=STT_ENGINE=web \
        --base-href=/$1/ \
        --output=build/web/$1

  check-ad-ids:
    description: Bricht, wenn eine echte AdMob-ID im Quelltext auftaucht.
    run: dart run tool/check_ad_ids.dart

  integration:
    description: >-
      Hauptablauf im headless Chrome mit Store-Screenshots (1170×2532).
      Braucht einen laufenden chromedriver auf Port 4444.
      Aufruf-  dart run melos run integration -- vox
    run: |
      cd apps/$1 && flutter drive --profile --no-web-resources-cdn \
        --driver=test_driver/integration_test.dart \
        --target=integration_test/app_test.dart \
        -d web-server --browser-name=chrome --headless \
        --browser-dimension=390,987 \
        --web-browser-flag=--force-device-scale-factor=3 \
        --web-browser-flag=--use-fake-device-for-media-stream \
        --web-browser-flag=--use-fake-ui-for-media-stream \
        --dart-define=FLAVOR=$1 --dart-define=STT_ENGINE=web
