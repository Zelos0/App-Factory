name: vox
description: Vox — Sprachnotizen ohne Umwege. App-Fabrik.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  capture_core:
    path: ../../packages/capture_core
  flutter:
    sdk: flutter
  shared_base:
    path: ../../packages/shared_base

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  # Pflicht — ohne diese Zeile fehlt die Icon-Schrift im Build und jedes
  # Icon erscheint als leeres Kästchen. Siehe app-derive Schritt 3.
  uses-material-design: true

  # Steckbrief: „Überschriften in einer schmalen Serifenschrift".
  # Crimson Pro, SIL OFL 1.1 — Lizenz liegt daneben (CrimsonPro-OFL.txt).
  # Mitgeliefert statt von Google Fonts geladen: kein Netz, kein Tracking.
  fonts:
    - family: CrimsonPro
      fonts:
        - asset: assets/fonts/CrimsonPro-Regular.ttf
        - asset: assets/fonts/CrimsonPro-Bold.ttf
          weight: 700
