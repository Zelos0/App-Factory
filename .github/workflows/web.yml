name: web

# Baut alle Flavors für den Browser und veröffentlicht sie.
#
# Ziel 1 — Cloudflare Pages, sobald CLOUDFLARE_API_TOKEN und
#          CLOUDFLARE_ACCOUNT_ID als Secrets hinterlegt sind. Jeder Branch
#          bekommt dort eine eigene Vorschau-URL.
# Ziel 2 — GitHub Pages, solange Cloudflare fehlt. Nur der Stand von main,
#          unter https://<nutzer>.github.io/<repo>/. Kostenlos, weil das
#          Repo öffentlich ist; keine Einrichtung nötig: der erste Lauf legt
#          den Branch gh-pages an, GitHub schaltet Pages darauf ein.
#
# Fehlt beides, bleibt der Lauf grün und legt den Build als Artefakt ab.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # gh-pages-Branch schreiben
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Festgenagelt: lokal (EINSPIELEN.md), CI und die pubspec.lock-Dateien
          # muessen dieselbe Version sehen. Neuere Dart-Versionen starten
          # melos 6.x nicht mehr. Anheben nur bewusst, zusammen mit melos.
          flutter-version: 3.24.5
          cache: true

      - name: Melos installieren
        run: dart pub get

      - name: Bootstrap
        run: dart run melos bootstrap

      - name: Ziel bestimmen
        id: target
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPO: ${{ github.event.repository.name }}
        run: |
          # main bekommt die echte Spracherkennung des Browsers; alle
          # anderen Branches den Stub mit festen Sätzen — für die Prüfliste
          # aus TESTLEITER.md, die reproduzierbare Ergebnisse braucht.
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "stt=platform" >> "$GITHUB_OUTPUT"
          else
            echo "stt=web" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "where=cloudflare" >> "$GITHUB_OUTPUT"
            echo "prefix=/" >> "$GITHUB_OUTPUT"
            echo "Ziel: Cloudflare Pages"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "where=ghpages" >> "$GITHUB_OUTPUT"
            echo "prefix=/$REPO/" >> "$GITHUB_OUTPUT"
            echo "Ziel: GitHub Pages unter /$REPO/"
          else
            echo "where=none" >> "$GITHUB_OUTPUT"
            echo "prefix=/$REPO/" >> "$GITHUB_OUTPUT"
            echo "Kein Deploy für diesen Branch — Build landet als Artefakt."
          fi

      - name: Flavors aus tool/flavors.yaml ermitteln
        id: flavors
        run: |
          list=$(grep -E '^  [a-z0-9_]+:$' tool/flavors.yaml | tr -d ' :' | paste -sd, -)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Gefundene Flavors: $list"

      - name: Alle Flavors bauen
        run: |
          mkdir -p build/web
          IFS=',' read -ra F <<< "${{ steps.flavors.outputs.list }}"
          for f in "${F[@]}"; do
            echo "::group::build $f"
            ( cd "apps/$f" && flutter build web --release --no-web-resources-cdn \
              --dart-define=FLAVOR="$f" \
              --dart-define=STT_ENGINE=${{ steps.target.outputs.stt }} \
              --base-href="${{ steps.target.outputs.prefix }}$f/" \
              --output="$GITHUB_WORKSPACE/build/web/$f" )
            echo "::endgroup::"
          done

      - name: Übersichtsseite erzeugen
        run: dart run tool/gen_web_index.dart

      - name: Deploy zu Cloudflare Pages
        if: steps.target.outputs.where == 'cloudflare'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy build/web
            --project-name=app-fabrik
            --branch=${{ github.ref_name }}

      - name: Deploy zu GitHub Pages
        if: steps.target.outputs.where == 'ghpages'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "web: ${{ github.sha }}"

      - name: Adresse ausgeben
        if: steps.target.outputs.where == 'ghpages'
        run: |
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "### Web-Demo: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Web-Demo: $url"

      - name: Web-Build als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ github.sha }}
          path: build/web
          retention-days: 7
