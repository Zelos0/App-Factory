name: capture_core
description: Sprach-Kern — Aufnahme, Wiedergabe, SttEngine mit drei Implementierungen, Eintrags-UI.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  audioplayers: ^6.1.0
  flutter:
    sdk: flutter
  # path, path_provider und uuid werden von platform_recorder.dart direkt
  # importiert. Sie kaemen zwar transitiv ueber shared_base, aber ein Paket
  # deklariert, was es selbst importiert — sonst bricht capture_core, sobald
  # shared_base eine dieser Abhaengigkeiten fallen laesst.
  path: ^1.9.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  record: ^5.1.2
  shared_base:
    path: ../shared_base
  speech_to_text: ^7.0.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
